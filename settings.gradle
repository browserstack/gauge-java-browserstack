pluginManagement {
    repositories {
        mavenCentral()
        mavenLocal()
        gradlePluginPortal()
        google()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "com.browserstack.gradle-sdk") {
                useModule("com.browserstack:gradle-sdk:1.1.2")
            }
            if (requested.id.id == "org.gauge") {
                useModule("org.gauge:org.gauge.gradle.plugin:1.8.2")
            }
        }
    }
}
rootProject.name = 'gauge-java-browserstack'

